# HTTP 요청을 HTTPS로 리디렉션
server {
    listen 80;
    server_name api.findynow.com;

    # 모든 요청을 HTTPS로 리디렉션
    return 301 https://$server_name$request_uri;
}

# HTTPS 서버 설정
server {
    listen 443 ssl;
    server_name api.findynow.com;

    ssl_certificate  /etc/letsencrypt/live/api.findynow.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/api.findynow.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    location /api {
        # OPTIONS 요청에 대한 CORS 처리
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        # CORS 헤더 추가
        set $allowed_origin "";
        if ($http_origin ~* "http://localhost:5173") {
            set $allowed_origin $http_origin;
        }
        if ($http_origin ~* "https://api.findynow.com") {
            set $allowed_origin $http_origin;
        }
        if ($http_origin ~* "http://findynow.com") {
            set $allowed_origin $http_origin;
        }
        if ($http_origin ~* "https://findynow.com") {
            set $allowed_origin $http_origin;
        }

        add_header 'Access-Control-Allow-Origin' "$allowed_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://findy-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://findy-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
