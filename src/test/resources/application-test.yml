spring:
  config:
    activate:
      on-profile: test

  application:
    name: FINDY_BE
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        hbm2ddl.auto: create
        show-sql: true
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        jdbc.lob.non_contextual_creation: true
  datasource:
    url: jdbc:tc:postgresql:10:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

jwt:
  secret: test_super_secret_key_for_jwt_testing

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: debug