spring:
  config:
    activate:
      on-profile: test

  application:
    name: FINDY_BE
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        hbm2ddl.auto: create
        show-sql: true
        jdbc.batch_size: 100                  # Batch size 설정
        order_inserts: true                  # Batch insert 시 Order by 적용
        order_updates: true                  # Batch update 시 Order by 적용
        batch_versioned_data: true           # 버전 관리되는 데이터를 Batch로 처리
        jdbc.lob.non_contextual_creation: true  # PostgreSQL에서 Large Object 지원 설정
  datasource:
    url: jdbc:tc:postgresql:10:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

jwt:
  secret: test_super_secret_key_for_jwt_testing

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: debug