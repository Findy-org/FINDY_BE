spring:
  application:
    name: FINDY_BE

  profiles:
    active: ${profile}
    include:
      - oauth

springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /local/api-docs.html
    enabled: true
    groups-order: ASC
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none

custom:
  swagger:
    key: local

server:
  url: ${SERVER_URL:http://localhost:8081}