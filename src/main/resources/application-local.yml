server:
  port: 8081

spring:
  application:
    name: FINDY_BE

  docker:
    compose:
      file: ./docker/compose-local.yaml

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
          generate_statistics: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/findy-db
    username: findy
    password: findydb!

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace