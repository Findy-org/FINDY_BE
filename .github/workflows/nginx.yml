name: NGINX Deployment Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_nginx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Docker Hub에 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Dockerfile.nginx Build & push
      - name: Build and push NGINX Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./docker/Dockerfile.nginx
          push: true
          tags: ${{ secrets.DOCKER_REPO }}:nginx-${{ github.run_number }}

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: deploy_nginx

    steps:
      - name: Configure SSH for EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PUBLIC_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PEM_KEY }}
          script: |
            echo ${{ secrets.DOCKER_PASSWORD }} | sudo docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            sudo docker pull ${{ secrets.DOCKER_REPO }}:nginx-${{ github.run_number }}
            
            if [ "$(sudo docker ps -q -f name=nginx)" ]; then
              sudo docker stop nginx && sudo docker rm nginx
            fi
          debug: true

      - name: Check nginx.conf file exists
        run: |
          if [ -f ./nginx/conf.d/nginx.conf ]; then
            echo "nginx.conf 파일이 존재합니다."
          else
            echo "nginx.conf 파일이 존재하지 않습니다."
            exit 1
          fi


      - name: Copy nginx.conf into EC2 instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PUBLIC_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PEM_KEY }}
          source: "nginx/conf.d/nginx.conf"
          target: "/home/${{ secrets.USERNAME }}/nginx/conf.d/nginx.conf"
          overwrite: true
          debug: true

      # Nginx 컨테이너 실행
      - name: Run Nginx Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PUBLIC_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PEM_KEY }}
          script: |
            sudo docker run -d --name nginx -p 80:80 -p 443:443 \
              -v /home/${{ secrets.USERNAME }}/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf \
              -v /etc/letsencrypt:/etc/letsencrypt \
              ${{ secrets.DOCKER_REPO }}:nginx-${{ github.run_number }}
          debug: true
